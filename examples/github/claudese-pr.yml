# Lint PR titles and bodies for Claudese in CI. No install on anyone's machine.
#
# Copy to .github/workflows/claudese-pr.yml in your repo. To start advisory
# instead of blocking, add `continue-on-error: true` to the job.
name: claudese

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-text:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ban-claudese
        run: |
          git clone --depth 1 --branch v0.2.1 \
            https://github.com/matiasdominguez/ban-claudese \
            "$RUNNER_TEMP/ban-claudese"

      - name: Lint PR title and body
        env:
          # Via env, never inlined into run: PR text is untrusted input.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.md"
          python3 "$RUNNER_TEMP/ban-claudese/hooks/claudese-lint.py" \
            --text "$RUNNER_TEMP/pr.md" \
            --patterns "$RUNNER_TEMP/ban-claudese/hooks/claudese-patterns.txt" \
            --label "PR text"

